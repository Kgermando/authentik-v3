[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authentik"
dynamic = ["version"]          # lu dans src/authentik/__init__.py (packaging/version.py)
description = "Detection de certificats administratifs falsifies (Ministere de la Formation Professionnelle, RDC)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "PySide6-Essentials>=6.6",   # QtCore, QtGui, QtWidgets suffisent (pas de navigateur web)
  "zeroconf>=0.130",
  "httpx>=0.27",
  "PyMuPDF>=1.24",
  "opencv-python-headless>=4.10,<5",
  "scikit-image>=0.22",
  "numpy>=1.26,<3",
  "scipy>=1.11",
  "pytesseract>=0.3.10",
  "onnxruntime>=1.17",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "imagehash>=4.3",
  "Pillow>=10.3",
  "pywin32>=306; sys_platform == 'win32'",
  "reportlab>=4.1",
  "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.5"]
train = ["torch>=2.2", "torchvision>=0.17", "easyocr>=1.7"]

[tool.setuptools.dynamic]
version = {attr = "authentik.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"authentik.app" = ["resources/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests/synthetic"]
